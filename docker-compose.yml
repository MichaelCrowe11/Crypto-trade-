version: '3.8'

services:
  crypto-trading-app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: crypto-trading-app
    restart: unless-stopped
    ports:
      - "8080:8080"  # API port
      - "8000:8000"  # Metrics port
    environment:
      - DATABASE_URL=sqlite:///data/crypto_trading.db
      - LOG_LEVEL=INFO
      - PAPER_TRADING=true
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./models:/app/models
      - ./keys:/app/keys
      - ./.env:/app/.env:ro
    networks:
      - crypto-trading-network
    depends_on:
      - prometheus
      - grafana

  prometheus:
    image: prom/prometheus:latest
    container_name: crypto-trading-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    networks:
      - crypto-trading-network

  grafana:
    image: grafana/grafana:latest
    container_name: crypto-trading-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - crypto-trading-network
    depends_on:
      - prometheus

  redis:
    image: redis:7-alpine
    container_name: crypto-trading-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - crypto-trading-network

volumes:
  prometheus_data:
  grafana_data:
  redis_data:

networks:
  crypto-trading-network:
    driver: bridge